<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Último Guardián - Modo Historia</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-wrapper">
        <div class="sidebar">
            <h2>Misión Activa</h2>
            <p id="quest-text">Explora el pueblo y habla con el Anciano.</p>
            <div class="controls-info">
                <p><strong>Controles:</strong></p>
                <p>Moverse: ⬆️⬇️⬅️➡️ o WASD</p>
                <p>Interactuar: Espacio o Enter</p>
            </div>
        </div>

        <div class="main-content">
            <div class="game-container">
                <div id="map" class="map-grid"></div>
            </div>

            <!-- Caja de Diálogo para la Historia -->
            <div id="dialogue-box" class="dialogue-box hidden">
                <span id="dialogue-name" class="dialogue-name">Anciano:</span>
                <p id="dialogue-text" class="dialogue-text">...</p>
                <span class="dialogue-prompt">Presiona Espacio para continuar...</span>
            </div>
        </div>
    </div>
</body>
</html>
